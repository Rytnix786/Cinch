version: "3.8"

services:
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    container_name: cinch-gateway
    restart: unless-stopped
    ports:
      - "8081:8000"
    environment:
      - VLLM_BASE_URL=http://vllm:8000
      - API_KEYS=["cinch-prod-key","cinch-dev-key"]
      - RATE_LIMIT_RPM=120
      - RATE_LIMIT_TPM=100000
      - CIRCUIT_BREAKER_ENABLED=true
      - SEMANTIC_CACHE_ENABLED=true
      - FINOPS_ENABLED=true
      - GUARDRAILS_ENABLED=true
      - TOOL_ENGINE_ENABLED=true
      - GRAMMAR_GUARD_ENABLED=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      vllm:
        condition: service_started

  vllm:
    image: vllm/vllm-openai:v0.6.3.post1
    container_name: cinch-vllm
    restart: unless-stopped
    ports:
      - "8000:8000"
    ipc: host
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    command: >
      --model Qwen/Qwen2.5-7B-Instruct-AWQ
      --quantization awq_marlin
      --gpu-memory-utilization 0.90
      --max-model-len 4096
      --host 0.0.0.0
      --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
