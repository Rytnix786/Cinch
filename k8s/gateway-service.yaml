apiVersion: v1
kind: Service
metadata:
  name: cinch-gateway
  namespace: cinch
  labels:
    app.kubernetes.io/name: cinch-gateway
    app.kubernetes.io/component: gateway
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: cinch-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
