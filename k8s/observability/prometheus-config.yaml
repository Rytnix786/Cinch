apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cinch
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: "cinch-gateway"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["cinch-gateway.cinch.svc.cluster.local:8080"]
            labels:
              app: "cinch-gateway"
              tier: "routing"

      - job_name: "vllm-engine"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["host.k3d.internal:8000"]
            labels:
              app: "vllm-engine"
              tier: "inference"
