apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-worker
  namespace: cinch
  labels:
    app.kubernetes.io/name: vllm-worker
    app.kubernetes.io/component: inference-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-worker
        app.kubernetes.io/component: inference-engine
    spec:
      nodeSelector:
        accelerator: nvidia-gpu
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.3.post1
          command: ["vllm", "serve"]
          args:
            - "Qwen/Qwen2.5-7B-Instruct-AWQ"
            - "--quantization"
            - "awq_marlin"
            - "--dtype"
            - "auto"
            - "--gpu-memory-utilization"
            - "0.85"
            - "--max-model-len"
            - "4096"
            - "--enforce-eager"
            - "--port"
            - "8000"
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: VLLM_WSL2_ENABLE_PIN_MEMORY
              value: "1"
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: "32Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
            - mountPath: /root/.cache/huggingface
              name: model-cache
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-model-cache-pvc
