<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-vllm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="grad-k8s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151d2e" />
      <stop offset="100%" stop-color="#0e1524" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="600" y="45" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700" letter-spacing="1">CINCH ENTERPRISE INFERENCE PLATFORM</text>
  <text x="600" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">14-Stage Middleware Gateway • PagedAttention KV-Cache • Kubernetes Autoscaling</text>

  <!-- 1. Client / Ingress Tier -->
  <g transform="translate(60, 100)" filter="url(#shadow)">
    <rect width="1080" height="70" rx="10" fill="url(#grad-card)" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="40" cy="35" r="16" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5" />
    <text x="40" y="40" text-anchor="middle" fill="#60a5fa" font-size="16">⚡</text>
    <text x="75" y="32" fill="#ffffff" font-size="15" font-weight="600">Client Ingress &amp; Real-Time Serving Console</text>
    <text x="75" y="50" fill="#94a3b8" font-size="12">OpenAI SDK Clients • SSE Token Stream UI (/ui/) • W3C Trace Context Propagation (traceparent)</text>
    <rect x="910" y="20" width="140" height="30" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="980" y="39" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">PORT 8081 (Traefik)</text>
  </g>

  <!-- Connector: Ingress -> Gateway -->
  <path d="M 600 170 L 600 205" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="596,205 604,205 600,212" fill="#3b82f6" />

  <!-- 2. Gateway Cluster Box -->
  <g transform="translate(60, 215)" filter="url(#shadow)">
    <rect width="1080" height="280" rx="12" fill="#0f172a" stroke="#2563eb" stroke-width="1.5" />
    <rect x="0" y="0" width="1080" height="36" rx="12" fill="url(#grad-accent)" />
    <text x="24" y="23" fill="#ffffff" font-size="13" font-weight="700" letter-spacing="0.5">CINCH GATEWAY CLUSTER (FastAPI Stateless Pods on k3d Multi-Node)</text>
    <text x="1056" y="23" text-anchor="end" fill="#dbeafe" font-size="11">Sub-Millisecond Execution (&lt;0.8ms Overhead)</text>

    <!-- Stage 1-4: Ingress Governance -->
    <g transform="translate(20, 50)">
      <rect width="250" height="210" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="15" y="26" fill="#38bdf8" font-size="12" font-weight="700">1. SECURITY &amp; FINOPS</text>
      <text x="15" y="55" fill="#f1f5f9" font-size="11">• Circuit Breaker FSM (45ms)</text>
      <text x="15" y="80" fill="#f1f5f9" font-size="11">• Multi-Tenant FinOps (402)</text>
      <text x="15" y="105" fill="#f1f5f9" font-size="11">• DAN Jailbreak Defense (400)</text>
      <text x="15" y="130" fill="#f1f5f9" font-size="11">• PII Data Redaction Masking</text>
      <text x="15" y="155" fill="#f1f5f9" font-size="11">• Sliding Window RPM / TPM</text>
      <rect x="15" y="175" width="220" height="22" rx="4" fill="#0f172a" />
      <text x="125" y="190" text-anchor="middle" fill="#10b981" font-size="10" font-weight="600">Zero Unpaid / Malicious GPU Load</text>
    </g>

    <!-- Stage 5-8: Routing & Optimizations -->
    <g transform="translate(285, 50)">
      <rect width="250" height="210" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="15" y="26" fill="#38bdf8" font-size="12" font-weight="700">2. CACHING &amp; ROUTING</text>
      <text x="15" y="55" fill="#f1f5f9" font-size="11">• Sub-5ms Semantic Cache (4.1ms)</text>
      <text x="15" y="80" fill="#f1f5f9" font-size="11">• Radix Prefix Affinity Router</text>
      <text x="15" y="105" fill="#f1f5f9" font-size="11">• Smart Cascading (0.5B vs 7B)</text>
      <text x="15" y="130" fill="#f1f5f9" font-size="11">• Multi-LoRA Compound Router</text>
      <text x="15" y="155" fill="#f1f5f9" font-size="11">• Context Prompt Compactor</text>
      <rect x="15" y="175" width="220" height="22" rx="4" fill="#0f172a" />
      <text x="125" y="190" text-anchor="middle" fill="#10b981" font-size="10" font-weight="600">4.87x Faster TTFT • 0W Cache Hits</text>
    </g>

    <!-- Stage 9-12: Scheduling & Structured Output -->
    <g transform="translate(550, 50)">
      <rect width="250" height="210" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="15" y="26" fill="#38bdf8" font-size="12" font-weight="700">3. SCHEDULING &amp; GRAMMAR</text>
      <text x="15" y="55" fill="#f1f5f9" font-size="11">• Dual-Tier Priority Queue</text>
      <text x="15" y="80" fill="#f1f5f9" font-size="11">• VIP Interactive Preemption</text>
      <text x="15" y="105" fill="#f1f5f9" font-size="11">• Guided JSON Grammar Guard</text>
      <text x="15" y="130" fill="#f1f5f9" font-size="11">• Auto AST Grammar Repair</text>
      <text x="15" y="155" fill="#f1f5f9" font-size="11">• Concurrency Slot Governor</text>
      <rect x="15" y="175" width="220" height="22" rx="4" fill="#0f172a" />
      <text x="125" y="190" text-anchor="middle" fill="#10b981" font-size="10" font-weight="600">100% Deterministic JSON Schema</text>
    </g>

    <!-- Stage 13-14: Execution & Duplication -->
    <g transform="translate(815, 50)">
      <rect width="245" height="210" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="15" y="26" fill="#38bdf8" font-size="12" font-weight="700">4. EXECUTION &amp; REPLAY</text>
      <text x="15" y="55" fill="#f1f5f9" font-size="11">• Agentic Tool Execution Loop</text>
      <text x="15" y="80" fill="#f1f5f9" font-size="11">• Isolated Sandboxes (Py/SQL)</text>
      <text x="15" y="105" fill="#f1f5f9" font-size="11">• Async Shadow Replayer</text>
      <text x="15" y="130" fill="#f1f5f9" font-size="11">• Zero-Overhead Replication</text>
      <text x="15" y="155" fill="#f1f5f9" font-size="11">• Jaccard Divergence Scoring</text>
      <rect x="15" y="175" width="215" height="22" rx="4" fill="#0f172a" />
      <text x="122" y="190" text-anchor="middle" fill="#10b981" font-size="10" font-weight="600">Zero-Roundtrip Client Synthesis</text>
    </g>
  </g>

  <!-- Connectors: Gateway -> Backend Tiers -->
  <path d="M 280 495 L 280 540" stroke="#38bdf8" stroke-width="2" />
  <polygon points="276,540 284,540 280,547" fill="#38bdf8" />

  <path d="M 600 495 L 600 540" stroke="#8b5cf6" stroke-width="2" />
  <polygon points="596,540 604,540 600,547" fill="#8b5cf6" />

  <path d="M 920 495 L 920 540" stroke="#0ea5e9" stroke-width="2" />
  <polygon points="916,540 924,540 920,547" fill="#0ea5e9" />

  <!-- 3. Lower Tier Execution Targets -->
  <!-- Left: Kubernetes HPA Autoscaler -->
  <g transform="translate(60, 550)" filter="url(#shadow)">
    <rect width="320" height="110" rx="10" fill="url(#grad-card)" stroke="#0284c7" stroke-width="1.2" />
    <text x="20" y="28" fill="#38bdf8" font-size="13" font-weight="700">KUBERNETES HPA AUTOSCALING</text>
    <text x="20" y="52" fill="#f1f5f9" font-size="11">• Scales 2 to 6 Gateway Replicas</text>
    <text x="20" y="72" fill="#f1f5f9" font-size="11">• CPU &amp; Concurrency Metric Targets</text>
    <text x="20" y="92" fill="#10b981" font-size="11" font-weight="600">✓ 0% Dropped Requests Under 223% Load</text>
  </g>

  <!-- Center: Upstream vLLM Quantized Engine -->
  <g transform="translate(410, 550)" filter="url(#shadow)">
    <rect width="380" height="110" rx="10" fill="url(#grad-card)" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="20" y="28" fill="#c084fc" font-size="13" font-weight="700">UPSTREAM vLLM ENGINE (CUDA 12.4)</text>
    <text x="20" y="52" fill="#f1f5f9" font-size="11">• Model: Qwen2.5-7B-Instruct-AWQ (Marlin W4A16)</text>
    <text x="20" y="72" fill="#f1f5f9" font-size="11">• Memory: PagedAttention KV-Cache (57.3 KB/tok)</text>
    <text x="20" y="92" fill="#10b981" font-size="11" font-weight="600">✓ 331.0 tok/s (10.86x) • 4.2 GiB VRAM (3.88x)</text>
  </g>

  <!-- Right: Candidate Shadow Backend & Sandboxes -->
  <g transform="translate(820, 550)" filter="url(#shadow)">
    <rect width="320" height="110" rx="10" fill="url(#grad-card)" stroke="#334155" stroke-width="1.2" />
    <text x="20" y="28" fill="#94a3b8" font-size="13" font-weight="700">SANDBOXES &amp; SHADOW BACKEND</text>
    <text x="20" y="52" fill="#f1f5f9" font-size="11">• Subprocess Python / SQLite Sandboxes</text>
    <text x="20" y="72" fill="#f1f5f9" font-size="11">• Asynchronous Candidate Replay Node</text>
    <text x="20" y="92" fill="#38bdf8" font-size="11" font-weight="600">✓ 0.0ms Primary Serving Latency Penalty</text>
  </g>

  <!-- 4. Observability Footer -->
  <g transform="translate(60, 680)" filter="url(#shadow)">
    <rect width="1080" height="50" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="30" y="30" fill="#f59e0b" font-size="12" font-weight="700">OBSERVABILITY</text>
    <text x="160" y="30" fill="#94a3b8" font-size="12">Prometheus Metrics (/metrics) • OpenTelemetry Distributed Spans • Real-Time FinOps Usage Ledger</text>
    <text x="1050" y="30" text-anchor="end" fill="#10b981" font-size="11" font-weight="600">195 Passing Tests</text>
  </g>
</svg>
